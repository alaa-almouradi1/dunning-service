image:
  repository: ghcr.io/alaa-almouradi1/dunning-service
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# The consumer and the scheduler run as separate Deployments because they
# scale differently:
#  - consumer: at most one active pod per partition of the topic; extra
#    replicas only stand by for failover.
#  - scheduler: scales freely (claims use SELECT ... FOR UPDATE SKIP LOCKED).
# Both serve the health, metrics and /cases endpoints.
consumer:
  enabled: true
  replicas: 3
scheduler:
  enabled: true
  replicas: 2
  concurrency: "10"

# Keep at least one pod of each component running during node drains.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  kafkaBrokers: kafka:9092
  kafkaTopic: billing.events
  kafkaDlqTopic: billing.events.dlq
  kafkaGroupId: dunning-service
  billingApiUrl: http://subscription-billing-api/api/v1
  retrySchedule: '["P1D","P3D","P5D","P7D"]'
  schedulerIntervalSeconds: "30"
  logLevel: INFO
  dbPoolSize: "15"
  # PLAINTEXT, SSL, SASL_PLAINTEXT or SASL_SSL (managed Kafka: SASL_SSL)
  kafkaSecurityProtocol: PLAINTEXT
  kafkaSaslMechanism: ""      # e.g. SCRAM-SHA-512
  kafkaSaslUsername: ""

# Secret created out of band (e.g. External Secrets or Vault); never commit it.
#   required: DUNNING_DATABASE_URL, DUNNING_BILLING_API_KEY
#   optional: DUNNING_ADMIN_TOKEN (enables /cases), DUNNING_METRICS_TOKEN
#             (enables /metrics), DUNNING_KAFKA_SASL_PASSWORD
existingSecret: dunning-service

migrations:
  enabled: true   # runs `alembic upgrade head` as a pre-install/pre-upgrade hook

service:
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Time to finish the current batch after SIGTERM before Kubernetes kills the pod.
terminationGracePeriodSeconds: 45

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
