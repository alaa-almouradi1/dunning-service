[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dunning-service"
version = "0.1.0"
description = "Event-driven payment recovery (dunning) for the subscription billing API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11,<1",
    "aiomysql>=0.2,<1",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dunning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "DTZ"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["dunning"]

[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "kafka: needs a real Kafka broker (KAFKA_BROKERS); run with -m kafka",
]
addopts = "-m 'not kafka'"
